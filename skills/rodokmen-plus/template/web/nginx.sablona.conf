# Šablona – nginx.conf z ní vyrábí tools/export_web.py (odpověď z data/web.json). Používá se jen při nasazení přes Docker/CapRover.
# Lehké přihlášení: přihlašovací stránka uloží do cookie "rodokmen" otisk (SHA-256) odpovědi na rodinnou otázku
# a nginx ho tady porovná. Samotná odpověď není ani tady, ani v prohlížeči.
# otisk má 64 znaků – do výchozího bucketu (64) se nevejde
map_hash_bucket_size 128;

map $cookie_rodokmen $rodokmen_ok {
  default 0;
{{ODPOVED}}
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # přihlašovací stránka je dostupná vždy
  location = /prihlaseni.html {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location / {
    if ($rodokmen_ok = 0) {
      return 401;
    }
    try_files $uri $uri/ =404;
  }

  # i Kniha předků: /kniha/<id>.pdf a tisková stránka /kniha/<id>/ (údaje žijících) jen po přihlášení
  location ~* \.(jpg|png|svg|css|js|woff2|json|pdf|pf_[a-z]+)$ {
    if ($rodokmen_ok = 0) {
      return 401;
    }
    expires 30d;
    add_header Cache-Control "private";
  }

  error_page 401 /prihlaseni.html;
  error_page 404 /404.html;
}
